server:
  port: 8081

spring:
  application:
    name: account-service
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:postgresql://localhost:5432/accountdb}
    username: ${DB_USER:bank}
    password: ${DB_PASSWORD:bank}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/account
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    template:
      observation-enabled: true   # gönderimde trace context'i Kafka header'ına yazılır
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      poll-timeout: 500ms
      observation-enabled: true   # tüketimde trace context'i Kafka header'ından okunur

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  bootstrap:
    admin-password: ${ADMIN_PASSWORD:Admin123!}
    teller-password: ${TELLER_PASSWORD:Teller123!}
  reconciliation:
    interval-ms: 300000     # muhasebe kontrolü 5 dakikada bir
    initial-delay-ms: 60000
  outbox:
    poll-interval-ms: 300
    batch-size: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s,3s
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}   # dev'de hepsi; production'da 0.05-0.1
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    # Her log satırı [servis, traceId, spanId] taşır: log'dan trace'e, trace'ten log'a geçilebilir.
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
