spring:
  application:
    name: bank-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bankdb}
    username: ${DB_USER:bank}
    password: ${DB_PASSWORD:bank}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8080

app:
  jwt:
    # En az 32 karakter. Gerçek ortamda JWT_SECRET ortam değişkeniyle ver.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    expiration-minutes: 60
  bootstrap:
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin123!}
    teller-password: ${BOOTSTRAP_TELLER_PASSWORD:Teller123!}
  kafka:
    topics:
      transfer-events: transfer-events
  outbox:
    poll-interval-ms: 500
    batch-size: 50
    send-timeout-ms: 10000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
