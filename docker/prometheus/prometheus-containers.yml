# Servisler docker compose "apps" profilinde container olarak çalışırken kullanılır:
#   PROM_CONFIG=./docker/prometheus/prometheus-containers.yml docker compose --profile apps up -d --build
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: bank-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['account-service:8081']
        labels: { service: account-service }
      - targets: ['transfer-service:8082']
        labels: { service: transfer-service }
      - targets: ['notification-service:8083']
        labels: { service: notification-service }
