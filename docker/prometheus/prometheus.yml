# Servisler host'ta (mvn spring-boot:run / IntelliJ) çalışır; Prometheus container'dan host.docker.internal ile ulaşır.
# Servisler de container'a alınırsa target'ları servis adlarıyla değiştir (account-service:8081 ...).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: bank-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels: { service: account-service }
      - targets: ['host.docker.internal:8082']
        labels: { service: transfer-service }
      - targets: ['host.docker.internal:8083']
        labels: { service: notification-service }
